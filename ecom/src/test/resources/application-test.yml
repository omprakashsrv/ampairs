spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  # Prevent Kafka listener containers from auto-starting in tests
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

  cloud:
    aws:
      region:
        static: us-east-1
        auto: false
      credentials:
        instance-profile: false
        access-key: test
        secret-key: test

ecom:
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    com.ampairs: WARN
    org.springframework: WARN
    org.hibernate: WARN

ampairs:
  aws:
    s3:
      enabled: false
    sns:
      enabled: false

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: PT1H
      refresh-token:
        expiration: P1D
    cors:
      allowed-origins: "http://localhost:4200"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: PT1H
    rate-limiting:
      enabled: false
  auth:
    otp:
      development-mode: true
      hardcoded-otp: "123456"
      allow-hardcoded: true

google:
  recaptcha:
    enabled: false
    secret-key: test
    site-key: test
    min-score: 0.0

notification:
  batch-size: 5
  retry-delay-minutes: 1
  cleanup-days: 1
  sms:
    primary-provider: MSG91
    msg91:
      enabled: false
    aws-sns:
      enabled: false
  email:
    enabled: false
