<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order &amp; Invoice — hi-fi prototype</title>
<link rel="stylesheet" href="tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

<link rel="stylesheet" href="app.css">
<style>
  html, body { margin: 0; background: var(--surface-dim); }
  #root { min-height: 100vh; }
  @media print {
    .oi-stagebar, .device > .screen .appbar, .tweaks-host, .fab { display: none !important; }
    .oi-stage { padding: 0; background: #fff; }
    .device { width: auto !important; height: auto !important; border: none !important; box-shadow: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- plain logic (no JSX) -->
<script src="calc.js"></script>
<script src="data.js"></script>
<script>
  var TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "mode": "desktop",
    "dark": false
  }/*EDITMODE-END*/;
</script>

<!-- React components (JSX via Babel) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="pickers.jsx"></script>
<script type="text/babel" src="editor.jsx"></script>
<script type="text/babel" src="invoice.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
