version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      testing:
        patterns: ["org.junit*", "org.mockito*", "org.testcontainers*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
