name: Provision Ampairs VM

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Override target host (defaults to repository variable SERVER_HOST)'
        required: false
        type: string
      domain:
        description: 'Override API domain (defaults to vars.API_DOMAIN or api.ampairs.in)'
        required: false
        type: string

jobs:
  configure:
    name: Configure remote VM via Ansible
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    defaults:
      run:
        shell: bash
    env:
      TARGET_HOST: ${{ inputs.host || vars.SERVER_HOST }}
      TARGET_USER: ${{ vars.SSH_USER }}
      TARGET_PORT: ${{ vars.SSH_PORT || '22' }}
      API_DOMAIN: ${{ inputs.domain || vars.API_DOMAIN || 'api.ampairs.in' }}
      APP_UPSTREAM: ${{ vars.APP_UPSTREAM || 'http://127.0.0.1:8080' }}
      LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
      KAFKA_VERSION: ${{ vars.KAFKA_VERSION || '3.9.0' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GCLOUD_RW_API_KEY: ${{ secrets.GCLOUD_RW_API_KEY }}
      BACKUP_DB_TYPE: ${{ vars.BACKUP_DB_TYPE || 'postgres' }}
      BACKUP_DB_NAME: ${{ vars.BACKUP_DB_NAME }}
      BACKUP_DB_HOST: ${{ vars.BACKUP_DB_HOST || 'localhost' }}
      BACKUP_DB_PORT: ${{ vars.BACKUP_DB_PORT || '5432' }}
      BACKUP_DB_USER: ${{ vars.BACKUP_DB_USER }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
      BACKUP_LOCAL_DIR: ${{ vars.BACKUP_LOCAL_DIR || '/var/backups/ampairs' }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '7' }}
      BACKUP_ON_CALENDAR: ${{ vars.BACKUP_ON_CALENDAR || 'hourly' }}
      BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}

    steps:
      - name: Validate required configuration
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_HOST}" ]]; then
            echo "SERVER_HOST repository variable (or manual host input) is required."
            exit 1
          fi
          if [[ -z "${TARGET_USER}" ]]; then
            echo "SSH_USER repository variable is required."
            exit 1
          fi
          if [[ -z "${LETSENCRYPT_EMAIL}" ]]; then
            echo "LETSENCRYPT_EMAIL repository variable is required for certificate requests."
            exit 1
          fi
          if [[ -z "${SSH_PRIVATE_KEY}" ]]; then
            echo "SSH_PRIVATE_KEY secret is required."
            exit 1
          fi
          if [[ -z "${AWS_ACCESS_KEY_ID}" ]]; then
            echo "AWS_ACCESS_KEY_ID secret is required."
            exit 1
          fi
          if [[ -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "AWS_SECRET_ACCESS_KEY secret is required."
            exit 1
          fi
          if [[ -z "${GCLOUD_RW_API_KEY}" ]]; then
            echo "GCLOUD_RW_API_KEY secret is required."
            exit 1
          fi
          if [[ -z "${BACKUP_DB_NAME}" ]]; then
            echo "BACKUP_DB_NAME repository variable is required."
            exit 1
          fi
          if [[ -z "${BACKUP_DB_USER}" ]]; then
            echo "BACKUP_DB_USER repository variable is required."
            exit 1
          fi
          if [[ -z "${BACKUP_DB_PASSWORD}" ]]; then
            echo "BACKUP_DB_PASSWORD secret is required."
            exit 1
          fi
          if [[ -z "${BACKUP_S3_BUCKET}" ]]; then
            echo "BACKUP_S3_BUCKET repository variable is required."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH for Ansible
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key — handle both real newlines and literal \n (single-line secrets),
          # and strip Windows-style \r\n endings that corrupt the PEM block.
          printf '%s' "${SSH_PRIVATE_KEY}" \
            | tr -d '\r' \
            | sed 's/\\n/\n/g' \
            > ~/.ssh/id_rsa

          # Ensure trailing newline required by OpenSSH / libcrypto
          if [[ "$(tail -c1 ~/.ssh/id_rsa | wc -c)" -eq 0 || "$(tail -c1 ~/.ssh/id_rsa)" != $'\n' ]]; then
            printf '\n' >> ~/.ssh/id_rsa
          fi

          chmod 600 ~/.ssh/id_rsa

          # Validate the key is parseable before Ansible tries to use it
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "ERROR: SSH private key is invalid or cannot be parsed. Check that SSH_PRIVATE_KEY"
            echo "is stored as a PEM-encoded private key with actual newlines (not literal \\n)."
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Scanning host key for ${TARGET_HOST}..."
          if ! ssh-keyscan -p "${TARGET_PORT}" -H "${TARGET_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Warning: ssh-keyscan failed, continuing."
          fi

      - name: Create Ansible inventory
        run: |
          printf "[target]\n%s ansible_host=%s ansible_user=%s ansible_port=%s ansible_ssh_private_key_file=%s\n" \
            "${TARGET_HOST}" "${TARGET_HOST}" "${TARGET_USER}" "${TARGET_PORT}" "$HOME/.ssh/id_rsa" > inventory.ini

      - name: Run Ansible playbook
        env:
          API_DOMAIN: ${{ env.API_DOMAIN }}
          APP_UPSTREAM: ${{ env.APP_UPSTREAM }}
          LETSENCRYPT_EMAIL: ${{ env.LETSENCRYPT_EMAIL }}
          KAFKA_VERSION: ${{ env.KAFKA_VERSION }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          GCLOUD_RW_API_KEY: ${{ env.GCLOUD_RW_API_KEY }}
          BACKUP_DB_TYPE: ${{ env.BACKUP_DB_TYPE }}
          BACKUP_DB_NAME: ${{ env.BACKUP_DB_NAME }}
          BACKUP_DB_HOST: ${{ env.BACKUP_DB_HOST }}
          BACKUP_DB_PORT: ${{ env.BACKUP_DB_PORT }}
          BACKUP_DB_USER: ${{ env.BACKUP_DB_USER }}
          BACKUP_DB_PASSWORD: ${{ env.BACKUP_DB_PASSWORD }}
          BACKUP_S3_BUCKET: ${{ env.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ env.BACKUP_S3_PREFIX }}
          BACKUP_LOCAL_DIR: ${{ env.BACKUP_LOCAL_DIR }}
          BACKUP_RETENTION_DAYS: ${{ env.BACKUP_RETENTION_DAYS }}
          BACKUP_ON_CALENDAR: ${{ env.BACKUP_ON_CALENDAR }}
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook ansible/setup_vm.yml \
            -i inventory.ini \
            -l target \
            -vv

      - name: Summarize final status
        if: always()
        run: |
          echo "Ansible run complete. Review logs above for detailed validation output."
