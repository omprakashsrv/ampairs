name: PR Checks

# Validates every pull request BEFORE merge. Complements deploy.yml, which only runs on
# pushes to main. The migrate job applies all Flyway migrations against a fresh PostgreSQL
# in dependency order — this catches version collisions and vendor-parity breaks that unit
# tests (H2, Flyway disabled) cannot.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to post the coverage comment on the PR
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle (with cache)
        # Caches the Gradle home (deps, wrapper) and the build cache (task outputs — used because
        # org.gradle.caching=true). cache-read-only=false so PR re-runs reuse earlier builds.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Repo has vestigial/empty per-module gradle-wrapper.jar files and uses a very new
          # Gradle whose checksum the action does not yet know; the build uses the root wrapper.
          validate-wrappers: false
      - run: chmod +x gradlew
      - name: Run tests with coverage
        # codeCoverageReport runs every module's `test` task and aggregates the
        # per-module JaCoCo data into one report. A test failure still fails the job.
        run: ./gradlew codeCoverageReport --console=plain
      - name: Publish coverage comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/aggregate/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Backend Code Coverage'
          update-comment: true
      - name: Upload HTML coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: build/reports/jacoco/aggregate/html/
          if-no-files-found: warn

  migrations:
    name: Flyway migrate + validate (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS image: customer V1.0.6 does CREATE EXTENSION postgis.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: springdb
          POSTGRES_USER: springuser
          POSTGRES_PASSWORD: springpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U springuser -d springdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Repo has vestigial/empty per-module gradle-wrapper.jar files and uses a very new
          # Gradle whose checksum the action does not yet know; the build uses the root wrapper.
          validate-wrappers: false
      - run: chmod +x gradlew
      - name: Apply migrations to a fresh database
        run: ./gradlew :ampairs_service:dbMigrate --console=plain
        env:
          DB_URL: jdbc:postgresql://localhost:5432/springdb
          DB_USERNAME: springuser
          DB_PASSWORD: springpass
      - name: Validate migration checksums & ordering
        run: ./gradlew :ampairs_service:dbValidate --console=plain
        env:
          DB_URL: jdbc:postgresql://localhost:5432/springdb
          DB_USERNAME: springuser
          DB_PASSWORD: springpass
