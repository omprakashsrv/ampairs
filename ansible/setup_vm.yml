---
- name: Configure Ampairs production VM
  hosts: all
  become: true
  gather_facts: true
  vars:
    domain_name: "{{ lookup('env', 'API_DOMAIN') | default('api.ampairs.in', true) }}"
    app_upstream: "{{ lookup('env', 'APP_UPSTREAM') | default('http://127.0.0.1:8080', true) }}"
    nginx_max_body_size: "{{ lookup('env', 'NGINX_MAX_BODY_SIZE') | default('20M', true) }}"
    letsencrypt_email: "{{ lookup('env', 'LETSENCRYPT_EMAIL') | default('', true) }}"
    kafka_version: "{{ lookup('env', 'KAFKA_VERSION') | default('3.9.0', true) }}"
    aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('', true) }}"
    aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('', true) }}"
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('ap-south-1', true) }}"
    gcloud_rw_api_key: "{{ lookup('env', 'GCLOUD_RW_API_KEY') | default('', true) }}"
    gcloud_hosted_metrics_id: "{{ lookup('env', 'GCLOUD_HOSTED_METRICS_ID') | default('2782251', true) }}"
    gcloud_hosted_metrics_url: "{{ lookup('env', 'GCLOUD_HOSTED_METRICS_URL') | default('https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push', true) }}"
    gcloud_hosted_logs_id: "{{ lookup('env', 'GCLOUD_HOSTED_LOGS_ID') | default('1386802', true) }}"
    gcloud_hosted_logs_url: "{{ lookup('env', 'GCLOUD_HOSTED_LOGS_URL') | default('https://logs-prod-028.grafana.net/loki/api/v1/push', true) }}"
    gcloud_fm_url: "{{ lookup('env', 'GCLOUD_FM_URL') | default('https://fleet-management-prod-018.grafana.net', true) }}"
    gcloud_fm_poll_frequency: "{{ lookup('env', 'GCLOUD_FM_POLL_FREQUENCY') | default('60s', true) }}"
    gcloud_fm_hosted_id: "{{ lookup('env', 'GCLOUD_FM_HOSTED_ID') | default('1429008', true) }}"
    gcloud_arch: "{{ lookup('env', 'GCLOUD_ARCH') | default('amd64', true) }}"
    backup_db_type: "{{ lookup('env', 'BACKUP_DB_TYPE') | default('postgres', true) }}"
    backup_db_name: "{{ lookup('env', 'BACKUP_DB_NAME') | default('', true) }}"
    backup_db_host: "{{ lookup('env', 'BACKUP_DB_HOST') | default('localhost', true) }}"
    backup_db_port: "{{ lookup('env', 'BACKUP_DB_PORT') | default('5432', true) }}"
    backup_db_user: "{{ lookup('env', 'BACKUP_DB_USER') | default('', true) }}"
    backup_db_password: "{{ lookup('env', 'BACKUP_DB_PASSWORD') | default('', true) }}"
    backup_s3_bucket: "{{ lookup('env', 'BACKUP_S3_BUCKET') | default('', true) }}"
    backup_s3_prefix: "{{ lookup('env', 'BACKUP_S3_PREFIX') | default('', true) }}"
    backup_local_dir: "{{ lookup('env', 'BACKUP_LOCAL_DIR') | default('/var/backups/ampairs', true) }}"
    backup_retention_days: "{{ lookup('env', 'BACKUP_RETENTION_DAYS') | default('7', true) }}"
    backup_on_calendar: "{{ lookup('env', 'BACKUP_ON_CALENDAR') | default('hourly', true) }}"
    postgresql_client_version: "{{ lookup('env', 'BACKUP_PG_VERSION') | default('17', true) }}"

  pre_tasks:
    - name: Fail if Let's Encrypt email is not provided
      ansible.builtin.fail:
        msg: "LETSENCRYPT_EMAIL environment variable must be supplied to request certificates."
      when: letsencrypt_email | length == 0

    - name: Fail if AWS credentials are not provided
      ansible.builtin.fail:
        msg: "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables must be supplied to configure AWS CLI."
      when: aws_access_key_id | length == 0 or aws_secret_access_key | length == 0

    - name: Fail if database backup configuration is incomplete
      ansible.builtin.fail:
        msg: "BACKUP_DB_NAME, BACKUP_DB_USER, BACKUP_DB_PASSWORD, and BACKUP_S3_BUCKET must be supplied for backups."
      when: backup_db_name | length == 0 or backup_db_user | length == 0 or backup_db_password | length == 0 or backup_s3_bucket | length == 0

    - name: Fail if Grafana Alloy API key is not provided
      ansible.builtin.fail:
        msg: "GCLOUD_RW_API_KEY environment variable must be supplied to configure Grafana Alloy."
      when: gcloud_rw_api_key | length == 0

  tasks:
    - name: Add PostgreSQL apt repository key
      ansible.builtin.apt_key:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        state: present

    - name: Configure PostgreSQL apt repository
      ansible.builtin.apt_repository:
        repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
        state: present

    - name: Ensure APT cache is fresh
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade system packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - openjdk-21-jre
          - nginx
          - certbot
          - python3-certbot-nginx
          - curl
          - "postgresql-client-{{ postgresql_client_version }}"
          - unzip
        state: present

    - name: Check current AWS CLI version
      ansible.builtin.command: aws --version
      register: aws_cli_version_check
      changed_when: false
      failed_when: false

    - name: Determine if AWS CLI install is required
      ansible.builtin.set_fact:
        aws_cli_install_needed: "{{ aws_cli_version_check.rc != 0 or 'aws-cli/2.' not in (aws_cli_version_check.stdout | default(aws_cli_version_check.stderr, true)) }}"

    - name: Install or update AWS CLI v2
      when: aws_cli_install_needed
      block:
        - name: Download AWS CLI v2 installer
          ansible.builtin.get_url:
            url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            dest: /tmp/awscliv2.zip
            mode: "0644"

        - name: Unpack AWS CLI v2 installer
          ansible.builtin.unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: true
            creates: /tmp/aws/install

        - name: Run AWS CLI v2 installer
          ansible.builtin.command: /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          args:
            creates: /usr/local/aws-cli/v2/current/bin/aws

        - name: Clean up AWS CLI installer artifacts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/awscliv2.zip
            - /tmp/aws

    - name: Ensure nginx service is enabled and started
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Check if nginx site configuration exists
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/{{ domain_name }}.conf
      register: nginx_site_conf

    - name: Create initial nginx site configuration when missing
      ansible.builtin.template:
        src: templates/api-ampairs-base.conf.j2
        dest: /etc/nginx/sites-available/{{ domain_name }}.conf
        owner: root
        group: root
        mode: "0644"
      when: not nginx_site_conf.stat.exists

    - name: Ensure ampairs proxy location block is present
      ansible.builtin.blockinfile:
        path: /etc/nginx/sites-available/{{ domain_name }}.conf
        marker: "# {mark} ampairs proxy"
        block: "{{ lookup('template', 'templates/api-ampairs-location.conf.j2') }}"
        insertafter: 'server_name'

    - name: Deploy nginx rate limiting configuration
      ansible.builtin.template:
        src: templates/nginx-rate-limiting.conf.j2
        dest: /etc/nginx/conf.d/ampairs-rate-limit.conf
        owner: root
        group: root
        mode: "0644"

    - name: Ensure AWS CLI configuration directory exists
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Configure AWS CLI credentials for backup profile
      ansible.builtin.copy:
        dest: /root/.aws/credentials
        owner: root
        group: root
        mode: "0600"
        content: |
          [backup]
          aws_access_key_id = {{ aws_access_key_id }}
          aws_secret_access_key = {{ aws_secret_access_key }}
      no_log: true

    - name: Configure AWS CLI profile settings
      ansible.builtin.copy:
        dest: /root/.aws/config
        owner: root
        group: root
        mode: "0600"
        content: |
          [profile backup]
          region = {{ aws_region }}

    - name: Ensure local backup directory exists
      ansible.builtin.file:
        path: "{{ backup_local_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Deploy database backup environment file
      ansible.builtin.template:
        src: templates/ampairs-db-backup.env.j2
        dest: /etc/ampairs-db-backup.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy database backup script
      ansible.builtin.template:
        src: templates/ampairs-db-backup.sh.j2
        dest: /usr/local/bin/ampairs-db-backup.sh
        owner: root
        group: root
        mode: "0750"

    - name: Deploy database restore script
      ansible.builtin.template:
        src: templates/ampairs-db-restore.sh.j2
        dest: /usr/local/bin/ampairs-db-restore.sh
        owner: root
        group: root
        mode: "0750"

    - name: Ensure restore log directory exists
      ansible.builtin.file:
        path: /var/log/ampairs
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Deploy Grafana Alloy environment file
      ansible.builtin.template:
        src: templates/grafana-alloy.env.j2
        dest: /etc/default/grafana-alloy
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart Grafana Alloy

    - name: Install Grafana Alloy if missing
      ansible.builtin.shell: |
        set -eu
        if systemctl list-unit-files | grep -q '^alloy.service'; then
          exit 0
        fi
        . /etc/default/grafana-alloy
        export GCLOUD_HOSTED_METRICS_ID GCLOUD_HOSTED_METRICS_URL GCLOUD_HOSTED_LOGS_ID \
          GCLOUD_HOSTED_LOGS_URL GCLOUD_FM_URL GCLOUD_FM_POLL_FREQUENCY GCLOUD_FM_HOSTED_ID \
          ARCH GCLOUD_RW_API_KEY
        /bin/sh -c "$(curl -fsSL https://storage.googleapis.com/cloud-onboarding/alloy/scripts/install-linux.sh)"
      args:
        executable: /bin/bash
        creates: /etc/systemd/system/alloy.service

    - name: Remove legacy Grafana Alloy comment block
      ansible.builtin.replace:
        path: /etc/alloy/config.alloy
        regexp: '^# BEGIN ampairs remote write$[\s\S]*?# END ampairs remote write$\n?'
        replace: ''
      when: ansible_facts['distribution'] is defined

    - name: Ensure Grafana Alloy remote write configuration
      ansible.builtin.blockinfile:
        path: /etc/alloy/config.alloy
        create: true
        marker: "// {mark} ampairs remote write"
        block: "{{ lookup('template', 'templates/grafana-alloy-remote-write.hcl.j2') }}"
        insertafter: EOF
      notify: Restart Grafana Alloy

    - name: Ensure Grafana Alloy service is enabled and running
      ansible.builtin.systemd:
        name: alloy.service
        enabled: true
        state: started

    - name: Deploy database backup systemd service
      ansible.builtin.template:
        src: templates/ampairs-db-backup.service.j2
        dest: /etc/systemd/system/ampairs-db-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Deploy database backup systemd timer
      ansible.builtin.template:
        src: templates/ampairs-db-backup.timer.j2
        dest: /etc/systemd/system/ampairs-db-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd to pick up backup units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ensure database backup timer is enabled
      ansible.builtin.systemd:
        name: ampairs-db-backup.timer
        enabled: true
        state: started

    - name: Enable ampairs nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/{{ domain_name }}.conf
        dest: /etc/nginx/sites-enabled/{{ domain_name }}.conf
        state: link
        force: true

    - name: Disable default nginx site if present
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload nginx to apply configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Obtain or renew Let's Encrypt certificate
      ansible.builtin.command: >
        certbot --nginx --non-interactive --agree-tos
        --redirect --email {{ letsencrypt_email }}
        -d {{ domain_name }}
      register: certbot_result
      changed_when: >
        'Certificate not yet due for renewal' not in
        ((certbot_result.stdout | default('')) ~ (certbot_result.stderr | default('')))

    - name: Ensure certbot timer is enabled for auto renewals
      ansible.builtin.systemd:
        name: certbot.timer
        state: started
        enabled: true

    - name: Create Kafka system user
      ansible.builtin.user:
        name: kafka
        system: true
        shell: /bin/false
        home: /opt/kafka-dist
        create_home: true

    - name: Ensure Kafka data and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: kafka
        group: kafka
        mode: "0750"
      loop:
        - /var/lib/kafka/data
        - /var/log/kafka
        - /opt/kafka-dist

    - name: Check if Kafka {{ kafka_version }} is already installed
      ansible.builtin.stat:
        path: "/opt/kafka-dist/kafka_2.13-{{ kafka_version }}/bin/kafka-server-start.sh"
      register: kafka_installed

    - name: Download Apache Kafka {{ kafka_version }}
      ansible.builtin.get_url:
        url: "https://downloads.apache.org/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
        dest: /tmp/kafka.tgz
        mode: "0644"
      when: not kafka_installed.stat.exists

    - name: Extract Apache Kafka
      ansible.builtin.unarchive:
        src: /tmp/kafka.tgz
        dest: /opt/kafka-dist
        remote_src: true
        owner: kafka
        group: kafka
      when: not kafka_installed.stat.exists

    - name: Ensure /opt/kafka symlink points to current version
      ansible.builtin.file:
        src: "/opt/kafka-dist/kafka_2.13-{{ kafka_version }}"
        dest: /opt/kafka
        state: link
        force: true

    - name: Deploy Kafka KRaft server.properties
      ansible.builtin.copy:
        dest: /opt/kafka/config/kraft/server.properties
        owner: kafka
        group: kafka
        mode: "0640"
        content: |
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:9093
          listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
          inter.broker.listener.name=PLAINTEXT
          advertised.listeners=PLAINTEXT://localhost:9092
          controller.listener.names=CONTROLLER
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          log.dirs=/var/lib/kafka/data
          num.partitions=1
          default.replication.factor=1
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          auto.create.topics.enable=true
          log.retention.hours=168
          log.segment.bytes=1073741824
          log.retention.check.interval.ms=300000
      notify: Restart Kafka

    - name: Check if Kafka KRaft storage is already formatted
      ansible.builtin.stat:
        path: /var/lib/kafka/data/meta.properties
      register: kafka_storage

    - name: Initialize Kafka KRaft storage (first run only)
      when: not kafka_storage.stat.exists
      block:
        - name: Generate Kafka cluster UUID
          ansible.builtin.command: /opt/kafka/bin/kafka-storage.sh random-uuid
          register: kafka_cluster_uuid
          changed_when: true
          become_user: kafka

        - name: Format Kafka KRaft storage
          ansible.builtin.command: >
            /opt/kafka/bin/kafka-storage.sh format
            -t {{ kafka_cluster_uuid.stdout | trim }}
            -c /opt/kafka/config/kraft/server.properties
          become_user: kafka

    - name: Deploy Kafka systemd service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/kafka.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Apache Kafka (KRaft single-node)
          Documentation=https://kafka.apache.org/documentation/
          After=network.target

          [Service]
          Type=simple
          User=kafka
          Group=kafka
          ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
          ExecStop=/opt/kafka/bin/kafka-server-stop.sh
          Restart=on-failure
          RestartSec=10
          LimitNOFILE=65536
          StandardOutput=append:/var/log/kafka/server.log
          StandardError=append:/var/log/kafka/server.log

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Kafka

    - name: Reload systemd to register Kafka unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ensure Kafka service is enabled and started
      ansible.builtin.systemd:
        name: kafka.service
        state: started
        enabled: true

    - name: Wait for Kafka to become ready on port 9092
      ansible.builtin.wait_for:
        port: 9092
        host: localhost
        timeout: 60

    - name: Validate Java 21 is installed
      ansible.builtin.command: java -version
      register: java_version
      changed_when: false

    - name: Display Java version
      ansible.builtin.debug:
        var: java_version.stderr_lines

    - name: Validate nginx service status
      ansible.builtin.service_facts:

    - name: Assert nginx is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: "nginx service is not running."
        success_msg: "nginx service is running."

    - name: Validate certificate files exist
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      register: cert_stat

    - name: Assert certificate was created
      ansible.builtin.assert:
        that:
          - cert_stat.stat.exists
        fail_msg: "Let's Encrypt certificate was not created for {{ domain_name }}."
        success_msg: "Let's Encrypt certificate is present."

    - name: Validate HTTPS endpoint responds locally
      ansible.builtin.command: >
        curl -Ik --resolve {{ domain_name }}:443:127.0.0.1 https://{{ domain_name }}
      register: https_probe
      failed_when: https_probe.rc != 0
      changed_when: false

    - name: Validate Kafka broker is responding
      ansible.builtin.command: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      register: kafka_api_check
      changed_when: false
      failed_when: kafka_api_check.rc != 0

    - name: Report Kafka broker API versions
      ansible.builtin.debug:
        var: kafka_api_check.stdout_lines

    - name: Validate AWS CLI installation
      ansible.builtin.command: aws --version
      register: aws_cli_version
      changed_when: false

    - name: Display AWS CLI version
      ansible.builtin.debug:
        msg: "{{ aws_cli_version.stdout | default(aws_cli_version.stderr, true) }}"

    - name: Confirm database backup timer is scheduled
      ansible.builtin.command: systemctl list-timers ampairs-db-backup.timer --no-legend
      register: backup_timer
      changed_when: false
      failed_when: backup_timer.rc != 0 or (backup_timer.stdout | length) == 0

    - name: Show next database backup run
      ansible.builtin.debug:
        var: backup_timer.stdout_lines

  handlers:
    - name: Restart Grafana Alloy
      ansible.builtin.systemd:
        name: alloy.service
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Kafka
      ansible.builtin.systemd:
        name: kafka.service
        state: restarted
